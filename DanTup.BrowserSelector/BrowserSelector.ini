; Default browser is first in list
; Use `{{url}}` to specify UWP app browser details
; Now supports scriban templates with model: { "url" : url }
[browsers]
vivaldi = C:\Users\ad\AppData\Local\Vivaldi\Application\vivaldi.exe
chrome = C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
opera = C:\Users\ad\AppData\Local\Programs\Opera beta\launcher.exe
ffox = C:\Program Files\Mozilla Firefox\firefox.exe
edge-new = C:\Users\ad\AppData\Local\Microsoft\Edge SxS\Application\msedge.exe
-- = ""
zoom = open zoommtg://zoom.us/join?action=join&confno={{ url | regex.match `\/j\/(\d+)\?` | array.last }}&{{ url | regex.match `pwd=.+` | array.first }}
; zoom = "C:\Users\ad\AppData\Roaming\Zoom\bin\Zoom.exe" --url=zoommtg://zoom.us/join?action=join&confno={{ url | regex.match `\/j\/(\d+)\?` | array.last }}&{{ url | regex.match `pwd=.+` | array.first }}
figma = C:\Users\ad\AppData\Local\Figma\Figma.exe
edge = microsoft-edge:{{url}}
ie = iexplore.exe
canary = C:\Users\ad\AppData\Local\Google\Chrome SxS\Application\chrome.exe
nightly = "C:\Program Files\Nightly\firefox.exe" -p "nightly" {{url}}
devfox = C:\Program Files\Firefox Developer Edition\firefox.exe
tor = C:\TBrowser\Browser\firefox.exes
; TODO: Add command parameters
; chrome_prof8 = "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe" --profile-directory="Profile 8"

; Url preferences.
; Only * is treated as a special character (wildcard).
; Matches are domain-only. Protocols and paths are ignored.
; Use "*.blah.com" for subdomains, not "*blah.com" as that would also match "abcblah.com".
[urls]
; microsoft.com = ie
; *.microsoft.com = ie

; Use my project-based Chrome profile
; myproject.live = chrome_prof8
; myproject.local = chrome_prof8

; if the key is wrapped in /'s, it is treated as a regex.
; /sites\.google\.com/a/myproject.live\.com/ = chrome_prof8

; google.com = chrome
; visualstudio.com = edge